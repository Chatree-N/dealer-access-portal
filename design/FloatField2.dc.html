<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>input::placeholder{color:#6B7280;opacity:1;font-style:italic;font-weight:400}@keyframes ff-spin{to{transform:rotate(360deg)}}</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:6px;min-width:0;font-family:Inter,system-ui,sans-serif">
  <fieldset onClick="{{ focusInput }}" style="margin:0;padding:0 14px;min-width:0;border-style:solid;border-width:{{ bw }};border-color:{{ bc }};border-radius:10px;background:{{ bg }};box-shadow:{{ ring }};transition:border-color .15s ease, box-shadow .15s ease;display:flex;align-items:center;gap:10px;cursor:{{ cursor }}">
    <legend style="padding:0 6px;margin-left:-6px;font-size:13px;line-height:16px;font-weight:500;color:{{ lc }};white-space:nowrap;transition:color .15s ease">
      <label for="{{ fid }}" style="cursor:inherit">{{ label }}</label><sc-if value="{{ required }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="color:#DC3E3E;margin-left:2px">*</span></sc-if>
    </legend>
    <sc-if value="{{ iSearch }}"><span aria-hidden="true" style="display:flex;flex:none;margin-top:-8px;color:{{ ic }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></span></sc-if>
    <sc-if value="{{ iUser }}"><span aria-hidden="true" style="display:flex;flex:none;margin-top:-8px;color:{{ ic }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg></span></sc-if>
    <sc-if value="{{ iMail }}"><span aria-hidden="true" style="display:flex;flex:none;margin-top:-8px;color:{{ ic }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3.5 6.5 8.5 6 8.5-6"></path></svg></span></sc-if>
    <sc-if value="{{ iKey }}"><span aria-hidden="true" style="display:flex;flex:none;margin-top:-8px;color:{{ ic }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15" r="4"></circle><path d="m11 12 9-9M17 6l3 3M15 8l2 2"></path></svg></span></sc-if>
    <sc-if value="{{ iPen }}"><span aria-hidden="true" style="display:flex;flex:none;margin-top:-8px;color:{{ ic }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"></path></svg></span></sc-if>
    <sc-if value="{{ iCal }}"><span aria-hidden="true" style="display:flex;flex:none;margin-top:-8px;color:{{ ic }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg></span></sc-if>
    <sc-if value="{{ isInput }}" hint-placeholder-val="{{ true }}">
      <input ref="{{ inRef }}" id="{{ fid }}" value="{{ val }}" onChange="{{ onInput }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" onKeyDown="{{ onKey }}" placeholder="{{ placeholder }}" readOnly="{{ readOnly }}" disabled="{{ disabled }}" tabIndex="{{ tabIndex }}" inputMode="{{ inputMode }}" type="{{ type }}" maxLength="{{ maxLength }}" autoComplete="{{ autoComplete }}" aria-invalid="{{ ariaInvalid }}" aria-describedby="{{ hid }}" aria-required="{{ ariaRequired }}" style="flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;line-height:24px;padding:4px 0 12px;margin:0;color:{{ tc }};font-family:{{ ff }};letter-spacing:{{ ls }};cursor:{{ cursor }};text-overflow:ellipsis">
    </sc-if>
    <sc-if value="{{ isSelect }}">
      <select ref="{{ selRef }}" id="{{ fid }}" value="{{ val }}" onChange="{{ onInput }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" disabled="{{ disabled }}" aria-describedby="{{ hid }}" style="flex:1;min-width:0;appearance:none;border:0;outline:0;background:transparent;font-family:inherit;font-size:16px;line-height:24px;padding:4px 0 12px;margin:0;color:{{ selColor }};cursor:pointer">
        <option value="" disabled="{{ true }}">{{ placeholder }}</option>
        <sc-for list="{{ options }}" as="o" hint-placeholder-count="3"><option value="{{ o }}">{{ o }}</option></sc-for>
      </select>
      <span aria-hidden="true" style="display:flex;flex:none;margin-top:-8px;color:{{ ic }};pointer-events:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></span>
    </sc-if>
    <sc-if value="{{ loading }}"><span style="display:flex;flex:none;margin-top:-8px">{{ spinner }}</span></sc-if>
    <sc-if value="{{ showLock }}"><span aria-hidden="true" style="display:flex;flex:none;margin-top:-8px;color:#6B7280"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span></sc-if>
    <sc-if value="{{ showOk }}"><span aria-hidden="true" style="display:flex;flex:none;margin-top:-8px;color:#2E7D5B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"></circle><path d="m8 12.5 2.8 2.8L16 9.5"></path></svg></span></sc-if>
    <sc-if value="{{ err }}"><span aria-hidden="true" style="display:flex;flex:none;margin-top:-8px;color:#DC3E3E"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"></circle><path d="M12 7.5v5.5M12 16.5h.01"></path></svg></span></sc-if>
  </fieldset>
  <sc-if value="{{ hasHelper }}" hint-placeholder-val="{{ false }}">
    <div id="{{ hid }}" role="{{ helperRole }}" style="display:flex;gap:6px;align-items:flex-start;font-size:13px;line-height:18px;color:{{ hc }};padding:0 2px;text-wrap:pretty">
      <sc-if value="{{ lockHelp }}"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:2px"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></sc-if>
      <sc-if value="{{ warn }}"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:2px"><path d="M12 3 2.5 20h19L12 3Z"></path><path d="M12 10v4.5M12 17.5h.01"></path></svg></sc-if>
      <span><sc-if value="{{ err }}"><span style="font-weight:600">Error: </span></sc-if>{{ helperText }}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:380,&quot;height&quot;:110},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Branch code&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;required&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;e.g. 1234&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;helper&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;error&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;warning&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;success&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;locked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;loading&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;forceFocus&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;mono&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;search&quot;,&quot;user&quot;,&quot;mail&quot;,&quot;key&quot;,&quot;pen&quot;,&quot;calendar&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(v: string) =&gt; void&quot;},&quot;onEnter&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { focused: false, v: null };
  autoId = 'ff-' + Math.random().toString(36).slice(2, 8);
  inRef = React.createRef();
  selRef = React.createRef();
  focusInput = () => { const el = this.inRef.current || this.selRef.current; if (el && !this.props.locked && !this.props.disabled) el.focus(); };
  renderVals() {
    const p = this.props;
    const locked = !!p.locked, dis = !!p.disabled, loading = !!p.loading;
    const focused = !locked && !dis && (this.state.focused || !!p.forceFocus);
    const err = !!p.error && !loading;
    const warn = !!p.warning && !err && !loading;
    const ok = !!p.success && !err && !loading;
    const val = p.onChange ? (p.value ?? '') : (this.state.v ?? p.value ?? '');
    const icon = p.icon || '';
    const fid = p.fid || this.autoId;
    const helperText = err ? p.error : loading ? (p.loadingText || p.helper || '') : warn ? p.warning : ok && p.successText ? p.successText : (p.helper ?? (locked ? 'Auto-filled from your branch code' : ''));
    return {
      label: p.label || '', required: !!p.required, fid, hid: fid + '-h',
      val, placeholder: p.placeholder || '', type: p.type || 'text', inputMode: p.inputMode || 'text',
      maxLength: p.maxLength || 120, autoComplete: p.autoComplete || 'off',
      readOnly: locked, disabled: dis, tabIndex: locked ? -1 : 0,
      ariaInvalid: err ? 'true' : 'false', ariaRequired: p.required ? 'true' : 'false',
      isSelect: !!p.options, isInput: !p.options, options: p.options || [],
      selColor: val ? '#111827' : '#6B7280',
      bw: focused || err ? '1.5px' : '1px',
      bc: err ? '#DC3E3E' : focused ? '#6D3FE0' : warn ? '#D9A23B' : ok ? '#2E7D5B' : (locked || dis) ? '#E5E7EB' : '#B8BEC9',
      bg: locked ? '#F3F4F6' : dis ? '#F9FAFB' : '#FFFFFF',
      ring: focused ? (err ? '0 0 0 2px rgba(220,62,62,.25)' : '0 0 0 2px rgba(109,63,224,.3)') : 'none',
      lc: err ? '#DC3E3E' : focused ? '#6D3FE0' : dis ? '#9CA3AF' : locked ? '#6B7280' : '#374151',
      tc: dis ? '#9CA3AF' : locked ? '#4B5563' : '#111827',
      ic: err ? '#DC3E3E' : focused ? '#6D3FE0' : dis ? '#C5CAD3' : '#6B7280',
      ff: p.mono ? "'JetBrains Mono',ui-monospace,monospace" : "Inter,system-ui,sans-serif",
      ls: p.mono ? (p.wide ? '0.3em' : '0.04em') : 'normal',
      cursor: locked || dis ? 'default' : 'text',
      iSearch: icon === 'search', iUser: icon === 'user', iMail: icon === 'mail', iKey: icon === 'key', iPen: icon === 'pen', iCal: icon === 'calendar',
      loading, showLock: locked, showOk: ok, err, warn,
      hasHelper: !!helperText, helperText, helperRole: err ? 'alert' : 'note', lockHelp: locked && !err,
      hc: err ? '#DC3E3E' : warn ? '#B45309' : ok && p.successText ? '#2E7D5B' : '#6B7280',
      spinner: React.createElement('span', { 'aria-label': 'Loading', style: { width: 16, height: 16, borderRadius: 999, border: '2px solid #DDD6FE', borderTopColor: '#6D3FE0', animation: 'ff-spin .8s linear infinite', display: 'inline-block', boxSizing: 'border-box' } }),
      onInput: e => { const v = e.target.value; this.setState({ v }); p.onChange && p.onChange(v); },
      onFocus: () => this.setState({ focused: true }),
      onBlur: () => { this.setState({ focused: false }); p.onBlur && p.onBlur(); },
      onKey: e => { if (e.key === 'Enter' && p.onEnter) { e.preventDefault(); p.onEnter(); } },
      inRef: this.inRef, selRef: this.selRef, focusInput: this.focusInput,
    };
  }
}
</script>
</body>
</html>
